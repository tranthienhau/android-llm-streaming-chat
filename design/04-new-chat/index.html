<!-- Micro-interactions Script -->
<script>
        const input = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-button');
        const sendIcon = sendBtn.querySelector('.material-symbols-outlined');

        // Simple state management for the send button
        input.addEventListener('input', (e) => {
            if (e.target.value.trim().length > 0) {
                sendBtn.style.transform = 'scale(1.1)';
            } else {
                sendBtn.style.transform = 'scale(1)';
            }
        });

        // Demo streaming state toggle
        let isStreaming = false;
        sendBtn.addEventListener('click', () => {
            if (input.value.trim() === '' && !isStreaming) return;

            if (!isStreaming) {
                // Change to Stop state
                isStreaming = true;
                sendIcon.textContent = 'stop';
                sendBtn.classList.remove('bg-primary');
                sendBtn.classList.add('bg-error');
                input.value = '';
                input.placeholder = 'AI is typing...';
                input.disabled = true;
            } else {
                // Change back to Send state
                isStreaming = false;
                sendIcon.textContent = 'arrow_upward';
                sendBtn.classList.remove('bg-error');
                sendBtn.classList.add('bg-primary');
                input.placeholder = 'Message';
                input.disabled = false;
                input.focus();
            }
        });

        // Keyboard support
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !isStreaming) {
                sendBtn.click();
            }
        });
    </script>
